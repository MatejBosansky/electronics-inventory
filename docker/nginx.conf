# Electronics Inventory: static app plus the data folder (/data) with WebDAV-style writes.
#
#   /            the app (baked into the image)
#   /data/       the inventory database (/srv/data in the container, mounted from the host):
#                  inventory.json       GET, HEAD, PUT
#                  images/<file>        GET, HEAD, PUT, DELETE
#                  images/thumbs/<file> GET, HEAD, PUT, DELETE
#                  backups/<file>       GET, HEAD, PUT, DELETE
#                directories return JSON listings (autoindex)
#   /api/, /mcp  REST API and MCP server, proxied to the "api" container
#
# PUT writes the body to /srv/data/.tmp first and then renames it into place, so a file is
# never half-written.

# Keep the scheme/host of a reverse proxy in front of this one (e.g. `tailscale serve`) for links.
map $http_x_forwarded_proto $inventory_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}
map $http_x_forwarded_host $inventory_host {
    ""      $http_host;
    default $http_x_forwarded_host;
}

server {
    listen 80 default_server;
    server_name _;

    # Optional HTTP basic auth, generated at start-up from AUTH_USER / AUTH_PASSWORD.
    include /etc/nginx/electronics-inventory-auth.conf;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types application/json application/manifest+json text/css text/javascript application/javascript;
    client_max_body_size 32m;
    server_tokens off;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /data/ {
        root /srv;
        autoindex on;
        autoindex_format json;
        client_body_temp_path /srv/data/.tmp;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Inventory-Storage "webdav" always;

        # Everything below /data/ is read-only unless a nested location allows more.
        limit_except GET HEAD {
            deny all;
        }

        location = /data/inventory.json {
            dav_methods PUT;
            limit_except GET HEAD PUT {
                deny all;
            }
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Inventory-Storage "webdav" always;
        }

        location ~ ^/data/(images|images/thumbs|backups)/[A-Za-z0-9][A-Za-z0-9._-]*$ {
            dav_methods PUT DELETE;
            limit_except GET HEAD PUT DELETE {
                deny all;
            }
        }

        location ^~ /data/.tmp/ {
            deny all;
        }
    }

    # REST API and MCP endpoint (server/inventory_server.py in the "api" container).
    # The upstream name is resolved per request, so nginx also starts without that container
    # (the API then answers 502).
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $inventory_api http://api:8000;
        proxy_pass $inventory_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $inventory_host;
        proxy_set_header X-Forwarded-Proto $inventory_proto;
        proxy_read_timeout 300s;
        client_max_body_size 48m;
    }

    location /mcp {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $inventory_api http://api:8000;
        proxy_pass $inventory_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $inventory_host;
        proxy_set_header X-Forwarded-Proto $inventory_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 48m;
    }
}
